[package]
name = "tymio"
version = "0.1.0"
description = "Project-scoped HR management: employees, contracts, leave and payroll"
authors = ["Ranto"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tymio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# Money. Never an f64 — see README "Money is never a float".
rust_decimal = { version = "1", default-features = false, features = ["std", "serde", "serde-with-str"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
# Only for `examples/devserver.rs`, which puts the commands behind HTTP so the
# Playwright suite can drive the real Rust backend. Never linked into the app.
tiny_http = "0.12"

